[tool.poetry]
name = "destination-prism"
version = "0.1.0"
description = "Destination connector for Prism Engine via Flight SQL."
authors = ["ClearTax"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
airbyte-cdk = "^7.9.1"
pyarrow = "15.0.2"
requests = "^2.31.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.2"
ruff = "^0.7.1"
coverage = "^7.5.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poe]
include = [
    "${POE_GIT_DIR}/poe-tasks/poetry-connector-tasks.toml",
]
[tool.poetry.scripts]
destination-prism = "destination_prism.run:run"
